name: Linux build and release
on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/linux-release.yml
      - scripts/*linux*
      - scripts/package-appimage.sh
      - src-tauri/**
permissions:
  contents: read
concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        timeout-minutes: 10
        run: |
          sudo bash scripts/configure-linux-apt.sh
          options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true -o Dpkg::Use-Pty=0)
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "${options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "${options[@]}" install -y --no-install-recommends build-essential curl wget file patchelf libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libfuse2 mpv yt-dlp xvfb xauth
      - run: rustup component add rustfmt clippy
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check
      - run: bash scripts/test-linux-runtime.sh
      - run: node --test scripts/release-assets.test.mjs scripts/check-release.test.mjs
      - name: Build tagged AppImage and licensing artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/package-appimage.sh "$PWD" "$GITHUB_REF_NAME" "$PWD/linux-assets"
      - name: Check native startup without preinstalled media tools
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir smoke-bin
          for tool in bash sh env dirname basename readlink realpath rm mkdir chmod uname mount fusermount fusermount3; do
            path=$(command -v "$tool" || true)
            if [ -n "$path" ]; then ln -s "$path" "smoke-bin/$tool"; fi
          done
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 timeout 20s xvfb-run -a env PATH="$PWD/smoke-bin" linux-assets/*.AppImage > smoke.log 2>&1
          status=$?
          set -e
          cat smoke.log
          test "$status" -eq 124
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: fuzzy-music-linux-appimage
          path: linux-assets/*
          compression-level: 0
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fuzzy-music-linux-appimage
          path: linux-assets
      - name: Wait for matching Windows and corresponding-source release
        run: |
          for attempt in $(seq 1 180); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q "Fuzzy-Music-${GITHUB_REF_NAME#v}-corresponding-source.zip"; then
              exit 0
            fi
            sleep 10
          done
          echo "Matching corresponding-source release did not become available." >&2
          exit 1
      - name: Verify and publish without overwriting assets
        run: |
          cd linux-assets
          sha256sum --check -- *.sha256
          gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY"
