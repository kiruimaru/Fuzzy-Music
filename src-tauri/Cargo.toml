[package]
name = "fuzzy-shell"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fuzzy-application = { path = "../crates/application" }
fuzzy-soundcloud = { path = "../crates/soundcloud" }
command-group = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
url = "2"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
lofty = "0.25.5"
tempfile = "3.27.0"
walkdir = "2.5.0"
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
serde_json = "1"
